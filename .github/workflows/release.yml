name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          archive="plz-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/plz" plz
          tar czf "$archive" plz
          sha256sum "$archive" >> SHA256SUMS
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            plz-*.tar.gz
            SHA256SUMS

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        run: |
          find artifacts -name SHA256SUMS -exec cat {} + | awk '!seen[$2]++' > SHA256SUMS
          ls -la artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            SHA256SUMS
            install.sh

  npm:
    name: publish to npm
    needs: release
    runs-on: ubuntu-latest
    environment: release-env # npm OIDC trusted publisher is scoped to this environment
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing (provenance is generated automatically)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships npm 10.
      - run: npm install -g npm@latest

      - name: Publish @sagwaco/plz
        working-directory: npm/pretty-plz
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Prereleases (vX.Y.Z-rc1) go to the `next` dist-tag, not `latest`.
          if [[ "$version" == *-* ]]; then dist=next; else dist=latest; fi
          npm pkg set version="$version"
          npm publish --access public --tag "$dist"

  homebrew:
    name: update homebrew tap
    needs: release
    if: ${{ !contains(github.ref_name, '-') }} # skip prereleases
    runs-on: ubuntu-latest
    environment: release-env # HOMEBREW_TAP_TOKEN is an environment secret here
    permissions:
      contents: read # read this repo's release assets via gh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: sagwaco/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Download checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS

      - name: Render formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag="$GITHUB_REF_NAME"
          declare -A sha
          for entry in \
            aarch64-apple-darwin:AARCH64_DARWIN \
            x86_64-apple-darwin:X86_64_DARWIN \
            aarch64-unknown-linux-musl:AARCH64_LINUX \
            x86_64-unknown-linux-musl:X86_64_LINUX; do
            target="${entry%%:*}"
            key="${entry#*:}"
            h="$(awk -v f="plz-${tag}-${target}.tar.gz" '{n=$2; sub(/^\*/,"",n)} n==f{print $1}' SHA256SUMS)"
            [[ -n "$h" ]] || { echo "missing sha256 for plz-${tag}-${target}.tar.gz in SHA256SUMS" >&2; exit 1; }
            sha[$key]="$h"
          done
          sed \
            -e "s|__VERSION__|${version}|g" \
            -e "s|__SHA_AARCH64_DARWIN__|${sha[AARCH64_DARWIN]}|g" \
            -e "s|__SHA_X86_64_DARWIN__|${sha[X86_64_DARWIN]}|g" \
            -e "s|__SHA_AARCH64_LINUX__|${sha[AARCH64_LINUX]}|g" \
            -e "s|__SHA_X86_64_LINUX__|${sha[X86_64_LINUX]}|g" \
            packaging/homebrew/plz.rb.tmpl > tap/Formula/plz.rb
          echo "----- rendered Formula/plz.rb -----"
          cat tap/Formula/plz.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Formula/plz.rb; then
            echo "formula unchanged; nothing to push"
            exit 0
          fi
          git add Formula/plz.rb
          git commit -m "plz ${GITHUB_REF_NAME#v}"
          git push
